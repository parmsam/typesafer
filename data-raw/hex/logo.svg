    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d9e1ea"/>
      <stop offset="1" stop-color="#9eabba"/>
    </linearGradient>
    <radialGradient id="knob" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8f9cad"/>
    </radialGradient>
