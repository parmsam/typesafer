<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1386" viewBox="0 0 1200 1386">
  <!-- typesafer hex sticker: a friendly type-safe safe. Render with data-raw/hex.R. -->
  <defs>
    <clipPath id="hex">
      <polygon points="600,23 1180.2,358 1180.2,1028 600,1363 19.8,1028 19.8,358"/>
    </clipPath>
    <radialGradient id="sky" cx="50%" cy="48%" r="62%">
      <stop offset="0" stop-color="#5ee0d1"/>
      <stop offset="0.55" stop-color="#22a99c"/>
      <stop offset="1" stop-color="#11606a"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a6b"/>
      <stop offset="1" stop-color="#d63c3f"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f25a52"/>
      <stop offset="1" stop-color="#c7323a"/>
